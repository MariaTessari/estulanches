<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EstuLanches</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header>
    <h1>EstuLanches</h1>
    <p>Cardápio e pedidos da cantina</p>
  </header>

  <main class="largo">
    <div class="duas-colunas">
      <section>
        <h2>Cardápio</h2>
        <ul id="cardapio"></ul>
        <p id="resumo"></p>

        <h2>Fazer pedido</h2>
        <form id="form-pedido">
          <label>Nome completo
            <input type="text" id="cliente" maxlength="60" autocomplete="name" placeholder="Ex.: Maria da Silva" required>
          </label>
          <button type="submit">Enviar pedido</button>
          <p class="msg" id="mensagem" role="status"></p>
        </form>
      </section>

      <section>
        <h2>Status do pedido</h2>
        <div id="acompanhamento"></div>
        <form id="form-busca">
          <label>Código do pedido
            <input type="text" id="codigo" maxlength="8" autocomplete="off" placeholder="Ex.: A1B2C3D4">
          </label>
          <button type="submit" class="claro">Ver status</button>
        </form>
      </section>
    </div>

    <p class="rodape"><a href="admin.html">Área da cantina</a></p>
  </main>

  <script src="comum.js"></script>
  <script src="cliente.js"></script>
</body>
</html>
